<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaivyron Training System — Chat</title>
<link rel="stylesheet" href="discord.css">
</head>
<body>
<div class="app">
  <!-- Server rail -->
  <nav class="rail">
    <div class="server-icon active" id="serverIcon" title="Kaivyron Training System">K</div>
    <div class="rail-sep"></div>
    <div class="server-icon plus" title="Add a Server">+</div>
  </nav>

  <!-- Channel sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="server-head"><span>Kaivyron Training System</span><span>▾</span></div>
    <div class="searchbar">🔍&nbsp; Search</div>
    <div class="channels" id="channels"></div>
    <div class="userbar">
      <div class="avatar">H<span class="dot"></span></div>
      <div class="who"><b>Haruto</b><span>Online</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Chat -->
  <main class="chat">
    <div class="chat-head">
      <button class="menu-btn" id="menuBtn">☰</button>
      <span class="hico" id="headIco">#</span>
      <span id="headName">verify-your-identity</span>
      <span class="spacer"></span>
      <span class="topico" title="Search">🔍</span>
      <span class="topico" title="Notifications">🔔</span>
      <span class="topico" title="Members">👥</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <input id="msgInput" type="text" placeholder="Message #verify-your-identity" autocomplete="off">
    </div>
  </main>
</div>

<!-- Long-press server popup -->
<div class="server-popup" id="serverPopup">
  <div class="pop-title">Kaivyron Training System</div>
  <button>✉️ Mark As Read</button>
  <button>🔔 Notifications</button>
  <button>⚙️ More Options</button>
</div>

<script>
// ===== Server data (from Haruto's screenshots) =====
var CATS = [
  { name: "Verify", channels: [
    { id: "verify-your-identity", type: "text" },
    { id: "Call verification (1)", type: "voice", limit: "00/02" },
    { id: "Call verification (2)", type: "voice", limit: "00/02" },
    { id: "Call verification (3)", type: "voice", limit: "00/02" },
    { id: "Call verification (4)", type: "voice", limit: "00/02" },
    { id: "Call verification (5)", type: "voice", limit: "00/02" },
  ]},
  { name: "Information", channels: [
    { id: "rules-and-guidelines", type: "text", lock: true },
    { id: "about-rankings", type: "text", lock: true },
    { id: "announcements-e", type: "text", lock: true },
    { id: "announcements", type: "text", lock: true },
    { id: "announcements", type: "voice", lock: true },
  ]},
  { name: "Have to Learn", channels: [
    { id: "essential-skills", type: "voice", lock: true },
    { id: "become-a", type: "voice", lock: true, sub: "Want to be something else?" },
  ]},
  { name: "Stay Updated", channels: [
    { id: "world-updates", type: "voice", lock: true },
    { id: "project-updates", type: "voice", lock: true, sub: "Project Blue Beam by Illuminate" },
    { id: "ask-about-anything", type: "voice", lock: true },
  ]},
  { name: "Text chat", channels: [
    { id: "general-e", type: "text", lock: true },
    { id: "general", type: "text", lock: true },
    { id: "topics", type: "voice", lock: true },
  ]},
  { name: "Voice chat", channels: [
    { id: "Voice chat (S)", type: "voice", limit: "00/06" },
    { id: "Voice chat (A)", type: "voice", limit: "00/06" },
    { id: "Voice chat (E)", type: "voice", limit: "00/06" },
  ]},
];

var WELCOME = {
  "verify-your-identity": [["Kaivyron Bot", "Welcome to Kaivyron Training System! Apni identity verify karo aur training shuru karo. 🖤", true]],
  "rules-and-guidelines": [["Kaivyron Bot", "1. Respect sabko do.\n2. Spam mat karo.\n3. Training channels me focus rakho.", true]],
  "about-rankings": [["Kaivyron Bot", "Ranks jald aayenge. Mehnat karo, rank pao. 💪", true]],
  "announcements": [["Kaivyron Bot", "Koi announcement nahi hai abhi. Stay tuned! 📢", true]],
  "announcements-e": [["Kaivyron Bot", "English announcements yahan aayenge.", true]],
  "general": [["Haruto", "Welcome to #general! 🎉", false]],
  "general-e": [["Haruto", "Welcome to #general-e! 🎉", false]],
};

var activeChan = "verify-your-identity";
var activeType = "text";

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderSidebar(){
  var box = document.getElementById("channels");
  box.innerHTML = "";
  CATS.forEach(function(cat){
    var head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = '<span class="caret">▾</span><span>• ' + esc(cat.name) + '</span>';
    var items = document.createElement("div");
    items.className = "cat-items";
    head.onclick = function(){ items.classList.toggle("closed"); head.classList.toggle("closed"); };
    cat.channels.forEach(function(ch){
      var d = document.createElement("div");
      d.className = "chan" + (ch.id === activeChan && ch.type === activeType ? " active" : "");
      var ico = ch.type === "text" ? "#" : "🔊";
      d.innerHTML = '<span class="ico">' + ico + '</span><span>' +
        (ch.type === "text" ? "" : "◦ ") + esc(ch.id) + "</span>" +
        (ch.lock ? '<span class="lock">🔒</span>' : "") +
        (ch.limit ? '<span class="limit">' + ch.limit + "</span>" : "");
      if (ch.sub) {
        var wrap = document.createElement("div");
        var sub = document.createElement("span");
        sub.className = "sub"; sub.textContent = "⤷ " + ch.sub;
        d.onclick = function(){ openChannel(ch); };
        wrap.appendChild(d); wrap.appendChild(sub);
        items.appendChild(wrap);
      } else {
        d.onclick = function(){ openChannel(ch); };
        items.appendChild(d);
      }
    });
    box.appendChild(head); box.appendChild(items);
  });
}

function openChannel(ch){
  activeChan = ch.id; activeType = ch.type;
  renderSidebar();
  document.getElementById("headIco").textContent = ch.type === "text" ? "#" : "🔊";
  document.getElementById("headName").textContent = ch.id;
  document.getElementById("msgInput").placeholder =
    ch.type === "text" ? "Message #" + ch.id : "Voice channels demo me available nahi hain";
  document.getElementById("msgInput").disabled = ch.type !== "text";
  renderMessages();
  document.body.classList.remove("nav-open");
}

function addMsg(who, text, bot){
  var box = document.getElementById("messages");
  var d = document.createElement("div");
  d.className = "msg";
  d.innerHTML = '<div class="avatar" style="background:' + (bot ? "#f0b232" : "#5865f2") + '">' +
    esc(who.charAt(0).toUpperCase()) + '</div><div class="body"><div class="meta"><b class="' +
    (bot ? "bot" : "") + '">' + esc(who) + '</b><time>Aaj</time></div><p>' +
    esc(text).replace(/\n/g, "<br>") + "</p></div>";
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function addNote(text){
  var box = document.getElementById("messages");
  var d = document.createElement("div");
  d.className = "sysnote"; d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function renderMessages(){
  var box = document.getElementById("messages");
  box.innerHTML = "";
  if (activeType === "voice") {
    addNote("🔊 " + activeChan + " — voice chat demo me available nahi hai. (Mission 3 beginning: visual replica)");
    return;
  }
  var msgs = WELCOME[activeChan] || [["Kaivyron Bot", "Welcome to #" + activeChan + "! 🖤", true]];
  msgs.forEach(function(m){ addMsg(m[0], m[1], m[2]); });
}

document.getElementById("msgInput").addEventListener("keydown", function(e){
  if (e.key === "Enter" && this.value.trim()) {
    addMsg("Haruto", this.value.trim(), false);
    this.value = "";
  }
});

// Mobile sidebar toggle
document.getElementById("menuBtn").onclick = function(){ document.body.classList.add("nav-open"); };
document.getElementById("scrim").onclick = function(){ document.body.classList.remove("nav-open"); };

// Long-press server icon -> popup (jaise screenshot me tha)
(function(){
  var icon = document.getElementById("serverIcon");
  var pop = document.getElementById("serverPopup");
  var timer = null;
  function show(x, y){
    pop.style.left = Math.min(x, window.innerWidth - 240) + "px";
    pop.style.top = Math.min(y, window.innerHeight - 200) + "px";
    pop.classList.add("show");
  }
  icon.addEventListener("contextmenu", function(e){ e.preventDefault(); show(e.clientX, e.clientY); });
  icon.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    timer = setTimeout(function(){ show(t.clientX, t.clientY); }, 600);
  }, {passive: true});
  ["touchend","touchmove"].forEach(function(ev){ icon.addEventListener(ev, function(){ clearTimeout(timer); }, {passive: true}); });
  document.addEventListener("click", function(e){
    if (!pop.contains(e.target) && e.target !== icon) pop.classList.remove("show");
  });
  pop.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ pop.classList.remove("show"); addNote("✅ " + b.textContent.trim() + " (demo)"); };
  });
})();

renderSidebar();
renderMessages();
</script>
</body>
</html>
