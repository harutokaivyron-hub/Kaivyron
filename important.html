<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIVYRON — Important</title>
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div class="glow"></div>

  <header>
    <h1 class="logo small">KAIVYRON</h1>
    <p class="tagline">Important...</p>
    <button class="settings-btn" id="settingsBtn" title="Settings">⋮</button>
    <div class="settings-menu" id="settingsMenu">
      <button id="editTextBtn">Edit Text</button>
    </div>
  </header>

  <main>
    <a class="btn ghost" href="index.html">← Back to Home</a>

    <section class="info-block">
      <h2>Important...</h2>
      <div class="text-block">
        <p>Soon...</p>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 Kaivyron — All rights reserved</p>
  </footer>

  <script>
    var sBtn = document.getElementById('settingsBtn');
    var sMenu = document.getElementById('settingsMenu');
    sBtn.onclick = function (e) {
      e.stopPropagation();
      sMenu.classList.toggle('show');
    };
    document.onclick = function () { sMenu.classList.remove('show'); };
    document.getElementById('editTextBtn').onclick = function () {
      sMenu.classList.remove('show');
      var code = prompt('Code dalo:');
      if (code === null) return;
      if (code.trim() === 'Proton@Onion.me') {
        window.location.href = 'https://github.com/harutokaivyron-hub/Kaivyron/edit/main/important.html';
      } else {
        alert('Galat code!');
      }
    };
  </script>
</body>
</html>
